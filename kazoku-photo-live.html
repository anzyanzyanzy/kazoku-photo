 var q=await sb.from("posts").select("id,member_id,message,posted_at,members(name),photos(path,position),comments(body,created_at,member_id,members(name)),reactions(kind,member_id)").eq("family_id",FID).order("posted_at",{ascending:false}).limit(200);
 if(q.error)throw q.error;
 var f=await sb.from("families").select("invite_code").eq("id",FID).single();
 var mm=await sb.from("members").select("name").eq("family_id",FID).order("created_at");
 FAM.code=f.data?f.data.invite_code:"";FAM.show=FAM.code.slice(0,4)+" "+FAM.code.slice(4);MEMS=(mm.data||[]).map(function(x){return x.name});
 var paths=[],url={};
 q.data.forEach(function(p){p.photos.forEach(function(h){paths.push(h.path)})});
 if(paths.length){var su=await sb.storage.from("photos").createSignedUrls(paths,3600);(su.data||[]).forEach(function(x){url[x.path]=x.signedUrl})}
 var sig=JSON.stringify(q.data.map(function(p){return[p.id,p.comments.length,p.reactions.length,p.photos.length]}))+MEMS.length;
 if(!lsGet("seen"))SEEN();
 var seen=+lsGet("seen");
 P.length=0;NT.length=0;
 q.data.forEach(function(p){
  var d=new Date(p.posted_at),who=p.members?p.members.name:"家族";
  var hs=p.photos.slice().sort(function(a,b){return a.position-b.position}).map(function(h){return{u:url[h.path],v:/\.(mp4|mov|webm|m4v)$/i.test(h.path)}}).filter(function(h){return h.u});
  var fst=hs[0]||{c:["#CBD5D4","#EEF4F3","#E5ECEB","#B7C6C4","#9DB0AD"]};
  var o={id:p.id,f:who,dt:d,d:fmt(d),y:d.getFullYear(),mo:(d.getMonth()+1)+"月",md:(d.getMonth()+1)+"/"+d.getDate(),m:p.message||"",u:fst.u,v:fst.v,c:fst.c||[],x:hs.slice(1),r:[],mine:[],
   k:p.comments.slice().sort(function(a,b){return a.created_at<b.created_at?-1:1}).map(function(c){return{w:c.members?c.members.name:"家族",t:c.body}})};
  p.reactions.forEach(function(r){if(o.r.indexOf(r.kind)<0)o.r.push(r.kind);if(r.member_id==MID)o.mine.push(r.kind)});
  P.push(o);
  if(p.member_id!=MID)NT.push({k:"post",p:o,who:who,txt:hs.length>1?"写真・動画を"+hs.length+"点 投稿しました":"写真を投稿しました",w:o.d,t:d.getTime(),nw:d.getTime()>seen});
  p.comments.forEach(function(c){if(c.member_id!=MID){var cd=new Date(c.created_at);NT.push({k:"cm",p:o,who:c.members?c.members.name:"家族",txt:"コメント「"+c.body+"」",w:fmt(cd),t:cd.getTime(),nw:cd.getTime()>seen})}})
 });
 NT.sort(function(a,b){return b.t-a.t});
 var ch=sig!=SIG;SIG=sig;return ch
}
async function poll(){
 if(OB!==null||tab=="send"||(document.activeElement&&document.activeElement.tagName=="INPUT"))return;
 try{if(await load()){OPEN={};keep(function(){})}}catch(e){}
}
function shrink(f){return new Promise(function(ok,ng){var im=new Image();im.onload=function(){var s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){b?ok(b):ng(new Error("shrink"))},"image/jpeg",0.82)};im.onerror=function(){ng(new Error("image"))};im.src=URL.createObjectURL(f)})}
async function POST(msg,items){
 var go=$("go");go.disabled=true;go.textContent="送っています…";
 try{
  var r=await sb.from("posts").insert({family_id:FID,member_id:MID,message:msg}).select("id").single();
  if(r.error)throw r.error;
  for(var i=0;i<items.length;i++){
   var f=items[i].f,isV=items[i].v,blob=isV?f:await shrink(f),ext=isV?((f.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"")||"mp4"):"jpg";
   var path=FID+"/"+r.data.id+"/"+i+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
   var u=await sb.storage.from("photos").upload(path,blob,{contentType:isV?(f.type||"video/mp4"):"image/jpeg"});
   if(u.error)throw u.error;
   var ph=await sb.from("photos").insert({post_id:r.data.id,path:path,position:i});
   if(ph.error)throw ph.error
  }
  draft=[];await load();cur=0;tab="home";render();toast("家族に送りました")
 }catch(e){fail(e);go.disabled=false;go.textContent="家族に送る"}
}
async function CMT(p,v){var r=await sb.from("comments").insert({post_id:p.id,member_id:MID,body:v});if(r.error)return fail(r.error);toast("コメントしました");await load();keep(function(){})}
async function RCT(p,k){var on=p.mine.indexOf(k)>-1,r=on?await sb.from("reactions").delete().eq("post_id",p.id).eq("member_id",MID).eq("kind",k):await sb.from("reactions").insert({post_id:p.id,member_id:MID,kind:k});if(r.error)return fail(r.error);if(!on)toast(S[k][1]+"を送りました");await load();keep(function(){})}
render();
init();
</script>
